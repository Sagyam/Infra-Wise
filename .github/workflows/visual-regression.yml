name: Visual Regression Tests

# Both jobs run inside the Playwright image, the same one `bun run test:e2e:docker` uses locally,
# so screenshots are rendered with identical fonts and compare pixel for pixel.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # setup-bun needs unzip, which the Playwright image lacks; bun's npm package ships the binary.
      - name: Install Bun
        run: npm install -g bun@1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Playwright's webServer builds and starts the app.
      - name: Run Playwright tests
        run: bunx playwright test
        env:
          CI: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 30

  update-baselines:
    # Run by hand after an intended visual change: renders new baselines and commits them.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        run: npm install -g bun@1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update baseline screenshots
        run: bunx playwright test --update-snapshots
        env:
          CI: true

      - name: Commit and push updated baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add e2e/*-snapshots/
          git diff --staged --quiet || git commit -m "chore: update visual regression baselines"
          git push
